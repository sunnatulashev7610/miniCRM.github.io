<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    animation: {
      'fade-in':'fadeIn .5s ease-out','slide-up':'slideUp .5s ease-out',
      'pulse-alert':'pulseAlert 1.8s infinite','scale-hover':'scaleHover .3s ease-out',
    },
    keyframes: {
      fadeIn:{'0%':{opacity:0},'100%':{opacity:1}},
      slideUp:{'0%':{opacity:0,transform:'translateY(20px)'},'100%':{opacity:1,transform:'translateY(0)'}},
      pulseAlert:{'0%,100%':{boxShadow:'0 0 0 0 rgba(239,68,68,.7)'},'50%':{boxShadow:'0 0 0 12px rgba(239,68,68,0)'}},

<style>
  body{font-family:'Inter',system-ui,sans-serif}
  .glass{background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5)}
  .dark .glass{background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.08)}

  .gradient-text{background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bg-app{background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 50%,#f5f3ff 100%)}
  .dark .bg-app{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)}
  .sidebar-item{transition:all .25s}
  .sidebar-item:hover{background:rgba(99,102,241,.1);transform:translateX(4px)}
  .sidebar-item.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 8px 25px -8px rgba(99,102,241,.6)}
  .input-field{background:rgba(255,255,255,.7);border:1px solid rgba(203,213,225,.6);transition:all .2s}
  .input-field:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.15);outline:none;background:rgba(255,255,255,.95)}
  .dark .input-field{background:rgba(30,41,59,.6);border-color:rgba(71,85,105,.5);color:#f1f5f9}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;transition:all .3s}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px rgba(99,102,241,.7)}
  .table-row{transition:all .2s}
  .table-row:hover{background:rgba(99,102,241,.06)}
  .dark .table-row:hover{background:rgba(139,92,246,.1)}
  .month-cell{transition:all .2s;cursor:pointer}
  .month-cell:hover{transform:scale(1.05)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:linear-gradient(#6366f1,#a855f7);border-radius:10px}
</style>

<body class="bg-app min-h-screen text-slate-800 dark:text-slate-100 transition-colors">

<!-- MODAL -->

<div id="toast" class="hidden fixed top-6 right-6 z-50 glass-strong px-6 py-4 rounded-2xl shadow-2xl animate-slide-up">
  <div id="toastMsg" class="font-medium"></div>
</div>

<script>
// ============== SOZLAMA (Supabase) ==============
// Bu ikkala qiymat OCHIQ bo'lishi mumkin (public). Xavfsizlikni baza ichidagi RLS qoidalari ta'minlaydi.
// Bu yerga HECH QACHON "service_role" kalitini qo'ymang!
const SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';

const CONFIGURED = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// Faqat qurilma sozlamalari (tema, daromadni yashirish) brauzerda qoladi. Asosiy ma'lumot serverda.
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('LS blocked',e)}}
};

// ============== STATE ==============
let state = {
  subjects: [],
  groups:   [],
  students: [],
  payments: [],
  userEmail: '',
  hideRevenue: LS.get('em_hideRev', true),
  page: 'dashboard',
  subjectId: null,   // when viewing groups inside a subject
  groupId: null,     // when viewing students inside a group
  studentId: null,   // when viewing payment grid for a student (modal)
};

// Ma'lumotlarni to'g'rilash (eski/yetishmayotgan maydonlar uchun)
function normalizeState(){
  state.students.forEach(s=>{
    if(!s.joinDate) s.joinDate = new Date(s.createdAt||Date.now()).toISOString().slice(0,10);
  });
  state.payments.forEach(p=>{
    if(!p.monthKey){
      const d=new Date(p.paymentDate||p.createdAt||Date.now());
      p.monthKey = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    }
  });
}

// ============== SERVER BILAN ISHLASH ==============
async function loadAll(){
  const {data,error} = await sb.from('em_data').select('key,value');
  if(error) throw error;
  const m = {}; (data||[]).forEach(r=>{ m[r.key]=r.value; });
  const arr = v => Array.isArray(v) ? v : [];
  state.subjects = arr(m.subjects);
  state.groups   = arr(m.groups);
  state.students = arr(m.students);
  state.payments = arr(m.payments);
  normalizeState();
}

let saveChain = Promise.resolve();
let pendingSaves = 0;
function save(){
  if(!sb) return;
  // Joriy holatning nusxasi (keyingi o'zgarishlar bilan aralashib ketmasligi uchun)
  const rows = [
    {key:'subjects', value:JSON.parse(JSON.stringify(state.subjects))},
    {key:'groups',   value:JSON.parse(JSON.stringify(state.groups))},
    {key:'students', value:JSON.parse(JSON.stringify(state.students))},
    {key:'payments', value:JSON.parse(JSON.stringify(state.payments))},
  ].map(r=>({...r, updated_at:new Date().toISOString()}));
  pendingSaves++;
  saveChain = saveChain.then(async()=>{
    try{
      const {error} = await sb.from('em_data').upsert(rows,{onConflict:'key'});
      if(error) throw error;
    }catch(e){
      console.error('Saqlash xatosi',e);
      toast("Saqlanmadi! Internetni tekshiring va sahifani yangilamang");
    }finally{ pendingSaves--; }
  });
}
window.addEventListener('beforeunload', e=>{ if(pendingSaves>0){ e.preventDefault(); e.returnValue=''; } });

const fmt = n => new Intl.NumberFormat('uz-UZ').format(Math.round(n||0));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today = () => new Date();
const ymd = d => { const x=new Date(d); return x.toISOString().slice(0,10);};
const monthKey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); };
const monthLabel = mk => {
  const [y,m]=mk.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('uz-UZ',{month:'short',year:'numeric'});
};


// ============== DARS KUNLARI / BIRINCHI OY HISOBI ==============
const WD=[{n:1,l:'Du'},{n:2,l:'Se'},{n:3,l:'Ch'},{n:4,l:'Pa'},{n:5,l:'Ju'},{n:6,l:'Sh'},{n:0,l:'Ya'}];
const pd=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c);};
const dmy=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
const dayLabels=wd=>WD.filter(x=>(wd||[]).includes(x.n)).map(x=>x.l).join(', ');
function countLessons(wd,from,to){let n=0;for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1))if(wd.includes(d.getDay()))n++;return n;}
// Kelgan oy uchun: oy ichidagi jami darslar, qolgan darslar, 1 dars narxi, birinchi oy summasi
function firstMonthInfo(joinDate,wd,fee){
  if(!joinDate||!wd||!wd.length||!fee)return null;
  const j=pd(joinDate),y=j.getFullYear(),m=j.getMonth(),end=new Date(y,m+1,0);
  const total=countLessons(wd,new Date(y,m,1),end), left=countLessons(wd,j,end);
  const per=total?fee/total:0;
  return {total,left,per,amount:Math.round(per*left),partial:j.getDate()>1};
}
function feeForMonth(s,mk){
  const fee=studentMonthlyFee(s), i=firstMonthInfo(s.joinDate,s.weekdays,fee);
  return (i&&i.partial&&mk===monthKey(pd(s.joinDate)))?i.amount:fee;
}
function calcHtml(joinDate,wd,fee){
  const i=firstMonthInfo(joinDate,wd,fee);
  if(!i)return `<div class="text-xs text-slate-400">Dars kunlari yoki oylik narx kiritilmagan — hisob-kitob ko'rsatilmaydi.</div>`;
  const j=pd(joinDate),nx=new Date(j.getFullYear(),j.getMonth()+1,1);
  const nxTotal=countLessons(wd,nx,new Date(nx.getFullYear(),nx.getMonth()+1,0)), nxPer=nxTotal?fee/nxTotal:0;
  const first=i.partial
    ? `<div class="flex justify-between gap-2"><span>1-oy: <b>${dmy(j)}</b> dan oy oxirigacha<br><span class="text-xs text-slate-500">${i.left} ta dars × ${fmt(i.per)} so'm (oyda ${i.total} ta dars)</span></span><b class="text-violet-600 dark:text-violet-300 whitespace-nowrap">${fmt(i.amount)} so'm</b></div>`
    : `<div class="flex justify-between gap-2"><span>1-oy to'liq (1-sanadan kelgan)</span><b class="whitespace-nowrap">${fmt(fee)} so'm</b></div>`;
  return `<div class="rounded-2xl p-3 bg-indigo-50 dark:bg-indigo-500/10 text-sm space-y-2">
    <div class="font-semibold">Hisob-kitob · ${dayLabels(wd)} (haftada ${wd.length} kun)</div>
    ${first}
    <div class="flex justify-between gap-2 border-t border-indigo-200/60 dark:border-slate-600 pt-2"><span>Keyingi oydan (<b>${dmy(nx)}</b>):<br><span class="text-xs text-slate-500">har bir dars (kunlik) ≈ ${fmt(nxPer)} so'm · oyda ${nxTotal} ta dars</span></span><b class="whitespace-nowrap">${fmt(fee)} so'm/oy</b></div>
  </div>`;
}

// ============== LOGIN ==============
function showLoginError(msg){
  const er=document.getElementById('loginError');
  er.textContent=msg; er.classList.remove('hidden');
  setTimeout(()=>er.classList.add('hidden'),4000);
}
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!sb){ showLoginError("Supabase sozlanmagan: manager.html ichidagi SUPABASE_URL va SUPABASE_ANON_KEY ni to'ldiring"); return; }
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Kirilmoqda...';
  try{
    const {error}=await sb.auth.signInWithPassword({email:u,password:p});
    if(error){ showLoginError('Email yoki parol xato'); return; }
    await startApp();
  }catch(err){
    console.error(err); showLoginError('Ulanishda xato. Internetni tekshiring');
  }finally{
    btn.disabled=false; btn.textContent='Kirish';
    document.getElementById('loginPass').value='';
  }
});
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  if(pendingSaves>0 && !confirm("Saqlanmagan o'zgarishlar bor. Baribir chiqasizmi?")) return;
  try{ if(sb) await sb.auth.signOut(); }catch{}
  location.reload();
});

// ============== DARK MODE ==============
if(LS.get('em_dark', false)) document.documentElement.classList.add('dark');
document.getElementById('darkToggle').addEventListener('click', ()=>{
  document.documentElement.classList.toggle('dark');
  LS.set('em_dark', document.documentElement.classList.contains('dark'));
  renderPage();
});

function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNav(); renderPage();
}
async function startApp(){
  try{
    const {data:{user}} = await sb.auth.getUser();
    if(!user) throw new Error('no user');
    state.userEmail = user.email || '';
    await loadAll();
    showApp();
  }catch(err){
    console.error(err);
    try{ await sb.auth.signOut(); }catch{}
    showLoginError("Ma'lumotni yuklab bo'lmadi yoki bu hisobga ruxsat yo'q");
  }
}
window.addEventListener('DOMContentLoaded', async ()=>{
  if(!sb){ showLoginError("Supabase sozlanmagan: SUPABASE_URL va SUPABASE_ANON_KEY ni to'ldiring"); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session) await startApp();
});

// ============== NAV ==============
const PAGES = [
  {id:'dashboard',name:'Dashboard',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'},
  {id:'subjects',name:'Fanlar',icon:'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'},
  {id:'payments',name:"To'lovlar",icon:'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z'},
  {id:'debtors',name:'Qarzdorlar',icon:'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z'},
  {id:'statistika',name:'Statistika',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'},
  {id:'settings',name:'Sozlamalar',icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z'},
];

function renderNav(){

// ============== FINANCE / DEBT LOGIC ==============
// For each student, generate list of expected months from joinDate to current month.
// Each month has a required amount = monthlyFee (override) or group.monthlyFee.
// Paid amount = sum of payments with monthKey === that month.
// If paid < required → debt.

function studentMonthlyFee(s){
  if(s.monthlyFee && Number(s.monthlyFee)>0) return Number(s.monthlyFee);
  const g = state.groups.find(g=>g.id===s.groupId);
  return Number((g&&g.monthlyFee)||0);
}

// Number of future months to always show beyond the current month.
// Change FUTURE_MONTHS_AHEAD to extend the visible payment timeline further.
const FUTURE_MONTHS_AHEAD = 12;
function expectedMonthsForStudent(s){
  const out=[];
  if(!s.joinDate) return out;
  const start = new Date(s.joinDate);
  const now = today();
  // End = current month + FUTURE_MONTHS_AHEAD months ahead
  let endY = now.getFullYear();
  let endM = now.getMonth() + FUTURE_MONTHS_AHEAD;
  endY += Math.floor(endM/12);
  endM = ((endM%12)+12)%12;
  // Also include any month that already has a payment (in case it's beyond the window)
  const payMonths = state.payments
    .filter(p=>p.studentId===s.id && p.monthKey)
    .map(p=>p.monthKey);
  payMonths.forEach(mk=>{
    const [py,pm]=mk.split('-').map(Number);
    if(py>endY || (py===endY && (pm-1)>endM)){ endY=py; endM=pm-1; }
  });
  let y=start.getFullYear(), m=start.getMonth();
  while(y<endY || (y===endY && m<=endM)){
    out.push(y+'-'+String(m+1).padStart(2,'0'));
    m++; if(m>11){m=0;y++;}
  }
  return out;
}

function paidForMonth(studentId, mk){
  return state.payments
    .filter(p=>p.studentId===studentId && p.monthKey===mk)
    .reduce((s,p)=>s+Number(p.amount||0),0);
}

function studentMonthsStatus(s){
  const curMk = monthKey(today());
  return expectedMonthsForStudent(s).map(mk=>{
    const fee = feeForMonth(s, mk);
    const paid = paidForMonth(s.id, mk);
    // Future months (keyingi oylar) qarzdor hisoblanmaydi — faqat hozirgi va o'tgan oylar.
    const isFuture = mk > curMk;
    const debt = isFuture ? 0 : Math.max(0, fee-paid);
    return { mk, fee, paid, debt, isFuture, status: paid>=fee?'paid':(paid>0?'partial':(isFuture?'upcoming':'unpaid')) };
  });
}

function studentTotalDebt(s){
  if(s.status==='inactive') return 0;
  return studentMonthsStatus(s).reduce((sum,m)=>sum+m.debt,0);
}

function currentMonthRevenue(){
  const mk = monthKey(today());
  return state.payments.filter(p=>p.monthKey===mk).reduce((s,p)=>s+Number(p.amount||0),0);
}
function totalRevenue(){ return state.payments.reduce((s,p)=>s+Number(p.amount||0),0); }
function totalDebtors(){ return state.students.filter(s=>s.status!=='inactive' && studentTotalDebt(s)>0).length; }
function totalOutstandingDebt(){ return state.students.filter(s=>s.status!=='inactive').reduce((s,st)=>s+studentTotalDebt(st),0); }

      const sj=state.subjects.find(s=>s.id===(g&&g.subjectId));

  else { const p=PAGES.find(p=>p.id===state.page); if(p) title=p.name; }

  document.getElementById('breadcrumb').innerHTML = crumb;

// ===== Ism ostidagi HISOB: bugungacha kelgan kunlar uchun hisoblangan summa =====
// Hisob boshlanishi: 1-sana (yoki oy o'rtasida kelgan bo'lsa kelgan sana) -> bugun.
// Hisoblangan = o'tgan dars kunlari soni x 1 dars narxi (1 dars = oylik / oydagi jami darslar).
function studentAccount(s,now=new Date()){
  const fee=studentMonthlyFee(s), wd=s.weekdays||[];
  if(!s.joinDate||!fee||!wd.length)return null;
  const j=pd(s.joinDate), y=now.getFullYear(), m=now.getMonth(), cmk=monthKey(now);
  const mStart=new Date(y,m,1), mEnd=new Date(y,m+1,0), today0=new Date(y,m,now.getDate());
  const from=j>mStart?j:mStart;
  const tot=countLessons(wd,mStart,mEnd), per=tot?fee/tot:0;
  const done=from>today0?0:countLessons(wd,from,today0);
  const accrued=Math.round(per*done), paid=paidForMonth(s.id,cmk);
  const out={from,done,tot,per,accrued,paid,left:Math.max(0,accrued-paid)};
  const fi=firstMonthInfo(s.joinDate,wd,fee);
  if(fi&&fi.partial&&monthKey(j)<cmk)out.firstDebt=Math.max(0,fi.amount-paidForMonth(s.id,monthKey(j)));
  return out;
}
function feeBadges(s){
  const a=studentAccount(s); if(!a)return '';
  const cls=(v,c)=>v===0?'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300':c;
  const bd=(t,c,title)=>`<span title="${title||''}" class="px-2 py-0.5 rounded-lg text-xs font-semibold whitespace-nowrap ${c}">${t}</span>`;
  const b=[
    bd(`${dmy(a.from)} dan: ${a.done} dars × ${fmt(a.per)} = ${fmt(a.accrued)}`,'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300',`Shu oyda oyda jami ${a.tot} ta dars`),
    bd(`Qoldiq: ${fmt(a.left)}`,cls(a.left,'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300'),`Hisoblangan ${fmt(a.accrued)} − to'langan ${fmt(a.paid)}`)
  ];
  if(a.firstDebt>0)b.push(bd(`1-oy qarzi: ${fmt(a.firstDebt)}`,'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300',"Kelgan oy uchun to'lanmagan qism"));
  return `<div class="flex flex-wrap gap-1 mt-0.5">${b.join('')}</div>`;
}

// Oy ostida qo'lda summa kiritish (kam yoki ko'p bo'lishi mumkin)
function manualPay(studentId,mk){
  const el=document.getElementById('mp_'+studentId+'_'+mk);
  let n;
  if(el) n=Number(el.value);
  else{ const v=prompt(`${monthLabel(mk)} uchun qo'shiladigan summa (so'm):`); if(v===null)return; n=Number(v); }
  if(!(n>0)){toast('Summani kiriting');return;}
  state.payments.push({id:uid(),studentId,amount:n,monthKey:mk,paymentDate:ymd(new Date()),createdAt:Date.now()});
  save();renderPage();toast("To'lov qo'shildi: "+fmt(n)+" so'm");
}

// One-click pay for a month
function quickPay(studentId, mk){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return;
  const fee=feeForMonth(s,mk);
  const paid=paidForMonth(studentId,mk);
  const remain=Math.max(0,fee-paid);
  if(remain<=0){
    if(!confirm(`${monthLabel(mk)} to'liq to'langan. To'lovni bekor qilasizmi?`))return;
    // remove latest payment for this month
    const idx=[...state.payments].map((p,i)=>({p,i})).reverse().find(o=>o.p.studentId===studentId&&o.p.monthKey===mk);
    if(idx){ state.payments=state.payments.filter(p=>p.id!==idx.p.id); save(); renderPage(); toast("To'lov o'chirildi"); }
    return;
  }
  const amount=prompt(`${monthLabel(mk)} uchun to'lov summasi:`, remain);
  if(amount===null)return;
  const n=Number(amount); if(!(n>0)){toast('Xato summa');return;}
  state.payments.push({id:uid(),studentId,amount:n,monthKey:mk,paymentDate:ymd(new Date()),createdAt:Date.now()});
  save(); renderPage(); toast("To'lov qo'shildi");
}

// ============== DEBTORS ==============
function renderDebtors(){
  const rows=state.students.filter(s=>s.status!=='inactive')
    .map(s=>({s, debt:studentTotalDebt(s), months:studentMonthsStatus(s).filter(m=>m.debt>0)}))
    .filter(r=>r.debt>0)
    .sort((a,b)=>b.debt-a.debt);
  document.getElementById('pageContent').innerHTML=`
    <div class="glass rounded-3xl p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold">Qarzdorlar ro'yxati (${rows.length})</h3>
        <div class="font-bold text-red-500">Jami: ${fmt(rows.reduce((s,r)=>s+r.debt,0))} so'm</div>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="text-left text-xs uppercase border-b border-slate-200 dark:border-slate-700">
          <th class="py-2">F.I.O</th><th class="py-2">Telefon</th><th class="py-2">Guruh</th><th class="py-2">Qarz oylar</th><th class="py-2 text-right">Summa</th>
        </tr></thead>
        <tbody>
          ${rows.length?rows.map(r=>{
            const g=state.groups.find(g=>g.id===r.s.groupId);
            return `<tr class="table-row border-b border-slate-100 dark:border-slate-700/50">
              <td class="py-3 font-medium cursor-pointer" onclick="openStudentPayments('${r.s.id}')">${escapeHtml(r.s.fullName)}</td>
              <td class="py-3">${escapeHtml(r.s.phone||'—')}</td>
              <td class="py-3">${g?escapeHtml(g.name):'—'}</td>
              <td class="py-3 text-xs">${r.months.map(m=>monthLabel(m.mk)).join(', ')}</td>
              <td class="py-3 text-right font-bold text-red-500">${fmt(r.debt)} so'm</td>
            </tr>`;
          }).join(''):`<tr><td colspan="5" class="text-center py-12 text-slate-400">Qarzdorlar yo'q 🎉</td></tr>`}
        </tbody>
      </table></div>
    </div>`;
}

// ============== STATS ==============
function renderStats(){
  document.getElementById('pageContent').innerHTML=`
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      ${statCard("Fanlar",state.subjects.length,'indigo','M12 6.253v13')}
      ${statCard("Guruhlar",state.groups.length,'violet','M19 11H5')}
      ${statCard("O'quvchilar",state.students.length,'emerald','M17 20h5v-2')}
      ${statCard("Joriy oy",fmt(currentMonthRevenue())+" so'm",'rose','M12 8v8')}
    </div>
    `;
}
function drawMonthlyChart(canvasId, months=6){
  const ctx=document.getElementById(canvasId);if(!ctx)return;
  const d=today();const labels=[],data=[];
  for(let i=months-1;i>=0;i--){
    const dt=new Date(d.getFullYear(),d.getMonth()-i,1);
    const mk=monthKey(dt);
    labels.push(dt.toLocaleDateString('uz-UZ',{month:'short',year:'2-digit'}));
    data.push(state.payments.filter(p=>p.monthKey===mk).reduce((s,p)=>s+Number(p.amount||0),0));
  }
  const grad=ctx.getContext('2d').createLinearGradient(0,0,0,300);
  grad.addColorStop(0,'rgba(139,92,246,0.9)');grad.addColorStop(1,'rgba(99,102,241,0.3)');
  new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:"Tushum",data,backgroundColor:grad,borderRadius:12,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}}});
}
function drawSubjectsChart(canvasId){
  const ctx=document.getElementById(canvasId);if(!ctx)return;
  const labels=state.subjects.map(sj=>sj.name);
  const data=state.subjects.map(sj=>{
    const grIds=state.groups.filter(g=>g.subjectId===sj.id).map(g=>g.id);
    return state.students.filter(s=>grIds.includes(s.groupId)).length;
  });
  if(!labels.length){ctx.getContext('2d').fillText("Ma'lumot yo'q",20,80);return;}
  new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444','#14b8a6'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},cutout:'65%'}});
}
function drawDailyChart(canvasId){
  const ctx=document.getElementById(canvasId);if(!ctx)return;
  const d=today();const labels=[],data=[];
  for(let i=29;i>=0;i--){
    const dt=new Date(d);dt.setDate(d.getDate()-i);
    labels.push(dt.getDate()+'/'+(dt.getMonth()+1));
    const sum=state.payments.filter(p=>{const x=new Date(p.paymentDate);return x.toDateString()===dt.toDateString();}).reduce((s,p)=>s+Number(p.amount),0);
    data.push(sum);
  }
  new Chart(ctx,{type:'line',data:{labels,datasets:[{label:"Tushum",data,borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,0.15)',fill:true,tension:0.4,pointRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}}});
}

// ============== SETTINGS ==============
function renderSettings(){
  document.getElementById('pageContent').innerHTML=`
    <div class="glass rounded-3xl p-6 space-y-4">
      <h3 class="font-bold text-lg">Sozlamalar</h3>
      <div class="grid sm:grid-cols-3 gap-4">
        <div class="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10"><div class="text-sm text-slate-500">Foydalanuvchi</div><div class="font-bold">${escapeHtml(state.userEmail)}</div></div>
        <div class="p-4 rounded-2xl bg-violet-50 dark:bg-violet-500/10"><div class="text-sm text-slate-500">Yozuvlar</div><div class="font-bold">${state.subjects.length+state.groups.length+state.students.length+state.payments.length}</div></div>
        <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-500/10"><div class="text-sm text-slate-500">Versiya</div><div class="font-bold">2.0</div></div>
      </div>
      <div class="flex flex-wrap gap-3 pt-4 border-t border-slate-200 dark:border-slate-700/50">
        <button onclick="exportData()" class="btn-primary px-5 py-3 rounded-2xl font-semibold">Backup yuklab olish</button>
        <label class="px-5 py-3 rounded-2xl font-semibold bg-slate-100 dark:bg-slate-700 cursor-pointer hover:bg-slate-200">
          Backup'dan tiklash
          <input type="file" accept=".json" onchange="importData(event)" class="hidden"/>
        </label>
        <button onclick="resetAll()" class="px-5 py-3 rounded-2xl font-semibold bg-red-500 text-white hover:bg-red-600">Hammasini tozalash</button>
      </div>
    </div>`;
}
function resetAll(){
  if(prompt("DIQQAT: serverdagi BARCHA ma'lumotlar o'chadi! Tasdiqlash uchun TOZALASH deb yozing:")!=='TOZALASH')return;
  state.subjects=[];state.groups=[];state.students=[];state.payments=[];
  save();renderPage();toast("Barcha ma'lumotlar tozalandi");
}
function exportData(){
  const blob=new Blob([JSON.stringify({subjects:state.subjects,groups:state.groups,students:state.students,payments:state.payments},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edumanager-'+ymd(new Date())+'.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    const A=v=>Array.isArray(v)?v:[];
    if(!confirm("Serverdagi hozirgi ma'lumotlar backup bilan almashtiriladi. Davom etasizmi?"))return;
    state.subjects=A(d.subjects);state.groups=A(d.groups);state.students=A(d.students);state.payments=A(d.payments);
    normalizeState();save();renderPage();toast('Tiklandi');}catch{toast('Xato!');}};r.readAsText(f);
}

// ============== UTILS ==============
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function escapeAttr(s){return escapeHtml(s);}
function openModal(){const m=document.getElementById('modal');m.classList.remove('hidden');m.classList.add('flex');}
function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function toast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500);}
</script>
